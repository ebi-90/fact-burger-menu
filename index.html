<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو فاكت برجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800;900&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
:root{--bg:#4b4b4d;--card:#5f5f61;--ink:#f6efe3;--mute:#c9c2b6;--gold:#e9a820;--line:#7a7a7c;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3eee4;--card:#fffaf0;--ink:#2d2a26;--mute:#6b645a;--gold:#b87a00;--line:#d8cfbd;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3eee4;--card:#fffaf0;--ink:#2d2a26;--mute:#6b645a;--gold:#b87a00;--line:#d8cfbd;color-scheme:light}
:root[data-theme="dark"]{--bg:#4b4b4d;--card:#5f5f61;--ink:#f6efe3;--mute:#c9c2b6;--gold:#e9a820;--line:#7a7a7c;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6;max-width:640px;margin:auto;padding:0 16px 48px}
header{padding:28px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.logo{font-family:'Abril Fatface',Georgia,serif;font-size:2.1rem;line-height:.95;direction:ltr;text-align:left}
.tag{font-family:'Abril Fatface',Georgia,serif;direction:ltr;font-size:1.05rem;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px var(--gold)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:0 -16px 8px;padding-inline:16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem;padding:6px 16px;border:1.5px solid var(--line);border-radius:999px}
nav a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav a.on{background:var(--gold);border-color:var(--gold);color:#2b2105}
h2{font-weight:900;font-size:1.6rem;margin:28px 0 12px;color:var(--gold)}
.item{background:var(--card);border-radius:22px 22px 22px 6px;padding:16px 18px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-weight:800;font-size:1.25rem}
.price{font-weight:900;font-size:1.6rem;color:var(--gold);white-space:nowrap}
.price small{font-size:.8rem;font-weight:500;color:var(--mute);margin-inline-start:4px}
.desc{color:var(--mute);font-size:.93rem;margin-top:4px}
.kcal{font-size:.85rem;color:var(--mute);margin-top:8px}
.sizes{display:flex;gap:6px;margin-top:12px}
.sizes button{flex:1;font:inherit;font-weight:700;padding:7px 0;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sizes button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.simple .row{padding:9px 0;border-bottom:1px dashed var(--line)}
.simple .row:last-child{border:0}
.simple .price{font-size:1.2rem}
footer{margin-top:28px;text-align:center;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<header>
  <div class="logo">FACT<br>BURGER</div>
  <div class="tag">LOCAL FLAVORS</div>
</header>
<nav id="tabs"></nav>
<main id="menu"></main>
<footer>الأسعار بالريال السعودي · السعرات الحرارية KCAL</footer>
<script>
const S=['سنقل','دبل','تربل'];
const cats=[
{id:'burgers',t:'البرجر',items:[
{n:'سنقل فاكت',p:10,add:[0,5,8],k:[279,431,565],d:'65 جرام من لحم العجل المحلي، قطعة جبنة بالإضافة للخس والطماطم والصوص المميز، في خبز البطاطس المخبوز يوميًا.'},
{n:'سيجنتشر فاكت',p:19,k:[735],d:'في خبز الكاكاو بشريحتين من اللحم البقري الطازج، بالإضافات: دبس الرمان، صوص، جبنة، خس، طماطم، بصل، هلابينو، مخلل.'}]},
{id:'meals',t:'الوجبات',items:[
{n:'وجبة سنقل',p:17,add:[0,5,10],k:[279,835,969],d:'65 جرام من اللحم البقري الطازج، قطعة جبنة بالإضافة للخس والطماطم والصوص المميز، في خبز البطاطس المخبوز يوميًا، مع بطاطس الكرسبرز ببهاراتنا الخاصة والمشروب.'},
{n:'سنقل فاكت كومبو',p:27,add:[0,10,18],k:[996,1136,1276],d:'2 برجر، 65 جرام لكل قطعة من اللحم البقري الطازج، قطعة جبنة بالإضافة للخس والطماطم والصوص المميز، في خبز البطاطس المخبوز يوميًا، مع بطاطس الكرسبرز ببهاراتنا الخاصة والمشروب والصوص.'}]},
{id:'sides',t:'الجانبية',items:[
{n:'كرسبرز فرايز',p:6,k:[257],d:'بطاطس كرسبرز بهشاشتها المميزة بالإضافة إلى بهاراتنا الخاصة.'},
{n:'تشيلي تشيز فرايز',p:16,k:[750],d:'بطاطس كرسبرز المميزة بالإضافة إلى لحم البقري الطازج المفروم والمطبوخ بخلطتنا الخاصة بالإضافة للصوصات.'}]},
{id:'drinks',t:'المشروبات',simple:1,items:[{n:'مشروبات غازية',p:3},{n:'سلاش',p:5},{n:'ماء',p:1}]},
{id:'extras',t:'الإضافات',simple:1,items:[{n:'شريحة جبنة',p:2},{n:'دبس رمان',p:2},{n:'هلابينو',p:1},{n:'مخلل',p:1},{n:'بصل',p:1}]}
];
const menu=document.getElementById('menu'),tabs=document.getElementById('tabs');
cats.forEach(c=>{
  const a=document.createElement('a');a.href='#'+c.id;a.textContent=c.t;a.dataset.id=c.id;tabs.append(a);
  const s=document.createElement('section');s.id=c.id;
  s.innerHTML='<h2>'+c.t+'</h2>';
  const wrap=document.createElement('div');if(c.simple)wrap.className='item simple';
  c.items.forEach(it=>{
    const el=document.createElement('div');
    if(c.simple){el.className='row';el.innerHTML='<span class="name" style="font-size:1.05rem;font-weight:500">'+it.n+'</span><span class="price">'+it.p+'<small>ر.س</small></span>';wrap.append(el);return}
    el.className='item';
    el.innerHTML='<div class="row"><div class="name">'+it.n+'</div><div class="price"></div></div><p class="desc">'+it.d+'</p><div class="kcal"></div>';
    const set=i=>{el.querySelector('.price').innerHTML=(it.p+(it.add?it.add[i]:0))+'<small>ر.س</small>';el.querySelector('.kcal').textContent=it.k[i]+' KCAL'+(it.add?' · '+S[i]:'')};
    if(it.add){
      const g=document.createElement('div');g.className='sizes';g.setAttribute('role','group');
      S.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',i==0);b.onclick=()=>{[...g.children].forEach((x,j)=>x.setAttribute('aria-pressed',j==i));set(i)};g.append(b)});
      el.append(g);
    }
    set(0);wrap.append(el);
  });
  if(c.simple)s.append(wrap);else[...wrap.children].forEach(x=>s.append(x));
  menu.append(s);
});
const links=[...tabs.children];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.dataset.id===e.target.id))}})},{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
</script>
</body>
</html>
